<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" style="background-color: #F8FAFC; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
